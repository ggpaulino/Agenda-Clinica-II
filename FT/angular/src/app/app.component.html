<h2>Clientes</h2>

<button>Adicionar Cliente</button>

<ul>
  <li *ngFor="let cliente of clientes">
    {{ cliente.nome }} - {{ cliente.email }}
  </li>
</ul>

<hr>

<h2>Animais</h2>

<button>Adicionar Animal</button>

<ul>
  <li *ngFor="let animal of animais">
    {{ animal.nome }} ({{ animal.especie }})
  </li>
</ul>
