<div class="container">

  <h2>Cliente</h2>
  <p>{{ cliente?.nome }}</p>

  <hr>

  <h3>Animais</h3>

  <div *ngIf="animais.length === 0">
    Nenhum animal cadastrado.
  </div>

  <div *ngFor="let animal of animais" class="animal-card">

    <strong>{{ animal.nome }}</strong>
    <p>{{ animal.especie }} - {{ animal.raca }} - {{ animal.idade }} anos</p>

    <button (click)="editarAnimal(animal)">Editar</button>
    <button (click)="removerAnimal(animal.id)">Excluir</button>

  </div>

  <hr>

  <button (click)="abrirFormularioAnimal()">
    Adicionar Animal
  </button>

  <button (click)="abrirAgendamento()">
    Prosseguir para Agendamento
  </button>

  <div *ngIf="mostrarFormulario" class="form">

    <h3 *ngIf="!modoEdicao">Novo Animal</h3>
    <h3 *ngIf="modoEdicao">Editar Animal</h3>

    <input [(ngModel)]="novoAnimal.nome" placeholder="Nome">
    <input [(ngModel)]="novoAnimal.especie" placeholder="Espécie">
    <input [(ngModel)]="novoAnimal.raca" placeholder="Raça">
    <input type="number" [(ngModel)]="novoAnimal.idade" placeholder="Idade">

    <button (click)="salvarAnimal()">
      {{ modoEdicao ? 'Atualizar' : 'Salvar' }}
    </button>

    <button (click)="cancelarFormulario()">
      Cancelar
    </button>

  </div>

</div>
