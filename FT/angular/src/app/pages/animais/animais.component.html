<app-layouts>
  <div class="page">

    <!-- Cabeçalho -->

    <section class="page-header">

      <h1>Animais</h1>

      <p>Gerencie os animais vinculados ao cliente selecionado.</p>

    </section>

    <!-- Cliente -->

    <section class="card mb-3">

      <h2>Cliente</h2>

      <p>

        <strong>{{ cliente?.nome }}</strong>

      </p>

    </section>

    <!-- Lista de animais -->

    <section class="card">

      <div class="d-flex justify-between align-center mb-2">

        <h2>Animais Cadastrados</h2>
        <button class="btn btn-primary" (click)="abrirFormularioAnimal()"> + Novo Animal </button>

      </div>

      <div class="alert alert-info" *ngIf="animais.length === 0"> Nenhum animal cadastrado.  </div>

      <div class="cliente-card" *ngFor="let animal of animais">
        <div class="cliente-info">
          <h3>  {{ animal.nome }} </h3>

          <p>
            {{ animal.especie }}
            •
            {{ animal.raca }}
            •
            {{ animal.idade }} anos
          </p>

        </div>

        <div class="cliente-actions">

          <button class="btn btn-secondary"(click)="editarAnimal(animal)"> Editar </button>
          <button class="btn btn-danger"(click)="removerAnimal(animal.id)"> Excluir </button>

        </div>

      </div>

    </section>

    <!-- Formulário -->

    <section class="card mt-3" *ngIf="mostrarFormulario">

      <h2> {{ modoEdicao ? 'Editar Animal' : 'Novo Animal' }}  </h2>

      <div class="form-row">

        <div class="form-group">

          <label class="form-label">  Nome </label>
          <input class="form-control" [(ngModel)]="novoAnimal.nome"> 
        </div>

        <div class="form-group">

          <label class="form-label"> Espécie </label>
          <input class="form-control" [(ngModel)]="novoAnimal.especie">
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">

          <label class="form-label">  Raça  </label>
          <input class="form-control" [(ngModel)]="novoAnimal.raca">
        </div>

        <div class="form-group">

          <label class="form-label">  Idade </label>
          <input class="form-control" type="number" [(ngModel)]="novoAnimal.idade">
        </div>
      </div>

      <div class="form-actions">

        <button class="btn btn-primary" (click)="salvarAnimal()"> {{ modoEdicao ? 'Atualizar' : 'Salvar' }} </button>
        <button class="btn btn-secondary" (click)="cancelarFormulario()">  Cancelar  </button>

      </div>

    </section>

    <!-- Rodapé da página -->

    <section class="actions mt-3">

      <button class="btn btn-success" (click)="abrirAgendamento()">  Prosseguir para Agendamento  </button>

    </section>

  </div>

</app-layouts>
