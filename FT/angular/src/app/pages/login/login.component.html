<div class="login-container">

  <h2>FT CLINIC</h2>

  <form (ngSubmit)="entrar()">

    <input
      type="text"
      [(ngModel)]="login"
      name="login"
      placeholder="Login"
      required
    >

    <input
      type="password"
      [(ngModel)]="senha"
      name="senha"
      placeholder="Senha"
      required
    >

    <button type="submit">
      Entrar
    </button>

  </form>

  <div *ngIf="erro" class="erro">
    {{ erro }}
  </div>

</div>
