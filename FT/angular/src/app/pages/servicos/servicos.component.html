<div class="servicos-container">

  <h2>Serviços Disponíveis</h2>

  <div *ngIf="servicos.length === 0">
    Nenhum serviço cadastrado.
  </div>

  <div class="card-servico" *ngFor="let servico of servicos">

    <h3>{{ servico.nome }}</h3>

    <p>
      {{ servico.descricao }}
    </p>

    <strong>
      R$ {{ servico.preco }}
    </strong>


  </div>

</div>
