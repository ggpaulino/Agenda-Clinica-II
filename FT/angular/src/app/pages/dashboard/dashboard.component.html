<div class="dashboard">

  <h1>
    Bem-vindo, {{ funcionario?.nome }}
  </h1>

  <hr>

  <!-- MENU PRINCIPAL -->

  <div class="menu-principal">

    <button (click)="criarCliente()">
      Criar Cliente
    </button>

    <button (click)="abrirServicos()">
      Serviços
    </button>

    <button (click)="logout()">
      Sair
    </button>

  </div>

  <hr>

  <!-- BUSCA -->

  <div class="busca-clientes">

    <h2>Procurar Cliente</h2>

    <input
      type="text"
      [(ngModel)]="buscaCliente"
      placeholder="Digite o nome do cliente"
    >

    <button (click)="buscarCliente()">
      Buscar
    </button>

    <div *ngIf="mensagem" class="mensagem">
      {{ mensagem }}
    </div>

    <!-- RESULTADOS -->

    <div
      class="cliente-item"
      *ngFor="let cliente of clientesEncontrados"
      (click)="selecionarCliente(cliente)"
    >

      <strong>{{ cliente.nome }}</strong>
      <br>
      {{ cliente.email }}

    </div>

  </div>

  <hr>

  <!-- CLIENTE SELECIONADO -->

  <div *ngIf="clienteSelecionado" class="cliente-selecionado">

    <h2>
      Cliente Selecionado
    </h2>

    <p>
      <strong>{{ clienteSelecionado.nome }}</strong>
    </p>

    <div class="menu-cliente">

      <button (click)="abrirAnimais()">
        Animais
      </button>

      <button (click)="abrirPagamentos()">
        Pagamentos
      </button>

      <button (click)="abrirAgendamento()">
        Agendar
      </button>

    </div>

  </div>

</div>
