
  <h1>
    Bem-vindo, {{ funcionario?.nome }}
  </h1>

  <hr>

  <!-- MENU PRINCIPAL -->

  <div class="menu-principal">

    <button (click)="criarCliente()">
      Criar Cliente
    </button>

    <button (click)="abrirServicos()">
      Serviços
    </button>

    <button (click)="logout()">
      Sair
    </button>

  </div>

  <hr>

  <!-- BUSCA -->

  <div class="busca-clientes">

    <h2>Procurar Cliente</h2>

    <input
      type="text"
      [(ngModel)]="buscaCliente"
      placeholder="Digite o nome do cliente"
    >

    <button (click)="buscarCliente()">
      Buscar
    </button>

    <div *ngIf="mensagem" class="mensagem">
      {{ mensagem }}
    </div>

    <!-- RESULTADOS -->

    <div class="cliente-item" *ngFor="let cliente of clientesEncontrados">

    <strong>  {{ cliente.nome }} </strong>
    <br>  {{ cliente.email }}
    <br><br>

    <button (click)="abrirAnimais(cliente)"> Animais </button>
    <button (click)="abrirPagamentos()"> Pagamentos </button>
    <button (click)="abrirAgendamento()"> Agendar </button>
   </div>
  </div>
  <hr>
