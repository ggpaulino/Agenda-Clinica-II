<div>

  <h2>Agendamentos</h2>

  <p><strong>Cliente:</strong> {{ cliente?.nome }}</p>

  <hr>

  <h3>Agendamentos existentes</h3>

  <div *ngIf="agendamentos.length === 0">
    Nenhum agendamento encontrado.
  </div>

  <div *ngFor="let a of agendamentos">

    <p>
      Animal ID: {{ a.animal_id }} |
      Serviço: {{ a.servico }} |
      Data: {{ a.data }} |
      Hora: {{ a.hora }}
    </p>

  </div>

  <hr>

  <button (click)="abrirFormulario()">
    Novo Agendamento
  </button>

  <div *ngIf="mostrarForm">

    <h3>Novo Agendamento</h3>

    <label>Animal</label>
    <select [(ngModel)]="novoAgendamento.animal_id">
      <option *ngFor="let a of animais" [value]="a.id">
        {{ a.nome }}
      </option>
    </select>

    <label>Serviço</label>
    <input [(ngModel)]="novoAgendamento.servico">

    <label>Data</label>
    <input type="date" [(ngModel)]="novoAgendamento.data">

    <label>Hora</label>
    <input type="time" [(ngModel)]="novoAgendamento.hora">

    <button (click)="salvar()">Salvar</button>
    <button (click)="cancelar()">Cancelar</button>

  </div>

</div>
