<div class="container">

  <h2>Novo Agendamento</h2>

  <p><strong>Cliente:</strong> {{ cliente?.nome }}</p>

  <hr>

  <label>Animal</label>
  <select [(ngModel)]="novoAgendamento.animal_id">
    <option [ngValue]="null">Selecione...</option>
    <option *ngFor="let a of animais" [ngValue]="a.id">
      {{ a.nome }}
    </option>
  </select>

  <label>Serviço</label>
  <select [(ngModel)]="novoAgendamento.servico_id">
    <option [ngValue]="null"> Selecione...</option>
    <option *ngFor="let s of servicos" [ngValue]="s.id">{{ s.nome }}
    </option>
  </select>

  <label>Data</label>
  <input
    type="date"
    [(ngModel)]="novoAgendamento.data">

  <label>Hora</label>
  <input
    type="time"
    [(ngModel)]="novoAgendamento.hora">

  <label>Observações</label>
  <textarea [(ngModel)]="novoAgendamento.observacoes"></textarea>
  
  <br><br>

  <button (click)="salvar()">
    Confirmar Agendamento
  </button>

  <button (click)="cancelar()">
    Cancelar
  </button>

</div>
