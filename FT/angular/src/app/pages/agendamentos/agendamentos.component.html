<div class="container">

    <h2>Novo Agendamento</h2>

    <p>
        <strong>Cliente:</strong>
        {{ cliente?.nome }}
    </p>

    <hr>

    <!-- Animal -->

    <label>Animal</label>

    <select [(ngModel)]="novoAgendamento.animal_id">

        <option [ngValue]="null">
            Selecione...
        </option>

        <option
            *ngFor="let animal of animais"
            [ngValue]="animal.id">

            {{ animal.nome }}

        </option>

    </select>

    <br><br>

    <!-- Serviço -->

    <label>Serviço</label>

    <select
        [(ngModel)]="novoAgendamento.servico_id"
        (change)="onServicoChange()">

        <option [ngValue]="null">
            Selecione...
        </option>

        <option
            *ngFor="let servico of servicos"
            [ngValue]="servico.id">

            {{ servico.nome }}

        </option>

    </select>

    <br><br>

    <!-- Executor -->

    <label>Executor</label>

    <select

        [(ngModel)]="novoAgendamento.executor_id"

        (change)="onExecutorChange()"

        [disabled]="executores.length === 0">

        <option [ngValue]="null">

            Selecione...

        </option>

        <option

            *ngFor="let executor of executores"

            [ngValue]="executor.id">

            {{ executor.nome }}

        </option>

    </select>

    <br><br>

    <!-- Data -->

    <label>Data</label>

    <input

        type="date"

        [(ngModel)]="novoAgendamento.data"

        [min]="hoje"

        (change)="onDataChange()">

    <br><br>

    <!-- Horário -->

    <label>Horário</label>

    <select

        [(ngModel)]="novoAgendamento.hora"

        [disabled]="
            !novoAgendamento.executor_id ||
            horariosDisponiveis.length === 0
        ">

        <option value="">

            Selecione...

        </option>

        <option

            *ngFor="let horario of horariosDisponiveis"

            [value]="horario.hora">

            {{ horario.hora }}

        </option>

    </select>

    <div

        *ngIf="

            novoAgendamento.executor_id &&

            novoAgendamento.data &&

            horariosDisponiveis.length === 0

        "

        class="alert alert-warning">

        Nenhum horário disponível para este profissional nesta data.

    </div>

    <br><br>

    <!-- Observações -->

    <label>Observações</label>

    <textarea

        rows="4"

        [(ngModel)]="novoAgendamento.observacoes">

    </textarea>

    <br><br>

    <button

        (click)="salvar()"

        [disabled]="

            !novoAgendamento.animal_id ||

            !novoAgendamento.servico_id ||

            !novoAgendamento.executor_id ||

            !novoAgendamento.data ||

            !novoAgendamento.hora

        ">

        Confirmar Agendamento

    </button>

    <button (click)="cancelar()">

        Cancelar

    </button>

</div>
