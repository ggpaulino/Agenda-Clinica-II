<div class="agendamento">

  <h1>
    Agendamento - {{ cliente?.nome }}
  </h1>

  <hr>

  <h2>Animais</h2>

  <div
    class="animal-card"
    *ngFor="let animal of animais"
  >
    <strong>{{ animal.nome }}</strong>
    - {{ animal.especie }}
  </div>

  <hr>

  <h2>Serviços</h2>

  <div
    class="servico-item"
    *ngFor="let servico of servicos"
  >

    <label>

      <input
        type="checkbox"
        (change)="toggleServico(servico)"
      >

      {{ servico.nome }}

      - R$ {{ servico.preco }}

    </label>

  </div>

  <hr>

  <input
    type="date"
    [(ngModel)]="data"
  >

  <input
    type="time"
    [(ngModel)]="horario"
  >

  <button (click)="confirmarAgendamento()">
    Confirmar Agendamento
  </button>

</div>
